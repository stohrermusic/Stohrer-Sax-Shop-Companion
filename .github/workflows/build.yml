name: Build Releases

on:
  push:
    branches: [main, beta, gamma]
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: SaxShopCompanion.exe
            asset_name: SaxShopCompanion-Windows.exe
            full_build: true
          - os: macos-latest
            artifact_name: SaxShopCompanion.app
            asset_name: SaxShopCompanion-macOS.zip
            full_build: true
          - os: macos-15-intel
            artifact_name: SaxShopCompanion.app
            asset_name: SaxShopCompanion-macOS-Intel.zip
            full_build: false
          - os: ubuntu-latest
            artifact_name: SaxShopCompanion
            asset_name: SaxShopCompanion-Linux
            full_build: true

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system audio libraries (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libx11-dev

      - name: Install dependencies (full)
        if: matrix.full_build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dependencies (legacy Mac — no audio)
        if: "!matrix.full_build"
        run: |
          python -m pip install --upgrade pip
          pip install svgwrite pyinstaller

      # GPU strobe tuner renderer (Rust/wgpu) — only for full builds
      - name: Install Rust toolchain
        if: matrix.full_build
        uses: dtolnay/rust-toolchain@stable

      - name: Build GPU tuner renderer
        if: matrix.full_build
        run: |
          pip install maturin
          python -m maturin build --release --manifest-path tuner_renderer/Cargo.toml
          pip install --find-links tuner_renderer/target/wheels tuner_render

      - name: Build with PyInstaller
        run: python build.py

      # Windows installer (Inno Setup). Must run before the bare-exe rename
      # because installer.iss sources dist\SaxShopCompanion.exe.
      - name: Extract app version from config.py
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $content = Get-Content config.py -Raw
          if ($content -match 'APP_VERSION\s*=\s*"([^"]+)"') {
            $ver = $Matches[1]
            "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "APP_VERSION=$ver"
          } else {
            Write-Error "Could not find APP_VERSION in config.py"
            exit 1
          }

      - name: Install Inno Setup
        if: matrix.os == 'windows-latest'
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Rename artifacts for release
      - name: Rename Windows artifact
        if: matrix.os == 'windows-latest'
        run: mv dist/SaxShopCompanion.exe dist/SaxShopCompanion-Windows.exe

      - name: Rename Linux artifact
        if: matrix.os == 'ubuntu-latest'
        run: mv dist/SaxShopCompanion dist/SaxShopCompanion-Linux

      # macOS: Create zip of .app bundle
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ${{ matrix.asset_name }} SaxShopCompanion.app

      # Upload artifacts
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

      - name: Upload Windows installer artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: SaxShopCompanion-Windows-Setup
          path: dist/SaxShopCompanion-Windows-Setup-*.exe

      # Attach to release if this is a release event
      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer to Release
        if: matrix.os == 'windows-latest' && github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/SaxShopCompanion-Windows-Setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
