name: Build Releases

on:
  push:
    branches: [main, beta]
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check .

  # Every suite in tools/, on all three desktop platforms. Windows and
  # macOS runners have a display, so the GUI suites (smoke, dialogs,
  # preview) run for real there — the macOS job is the only place the
  # IS_MACOS code paths ever execute, since nobody on the project owns a
  # Mac. Linux runs under xvfb. Full requirements are installed so the
  # OpenCV and pyserial suites run instead of self-skipping. Public repo:
  # Actions minutes are free, so this runs on every push.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libx11-dev libgl1 xvfb
      - name: Install dependencies
        if: matrix.os != 'macos-15-intel'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      # The Intel Mac build ships with numpy but WITHOUT sounddevice (no audio
      # features). Test it the way it ships: the audio suites skip, and
      # everything else runs for real on x86 macOS Tk.
      - name: Install dependencies (Intel Mac — the shipped set, no audio stack)
        if: matrix.os == 'macos-15-intel'
        run: |
          python -m pip install --upgrade pip
          pip install svgwrite numpy pillow babel
      - name: Run test suites
        if: runner.os != 'Linux' && matrix.os != 'macos-15-intel'
        run: python tools/run_tests.py
      - name: Run test suites (Intel Mac, numpy-less)
        if: matrix.os == 'macos-15-intel'
        # numpy ships in this build since 2026-10-06 (Matt: "include numpy for
        # them"); before that the pure-Python nest took 774 s on one suite here.
        # Only sounddevice is absent, so the audio suites skip and everything
        # else runs at full speed.
        run: python tools/run_tests.py --allow-missing sounddevice
      - name: Run test suites (xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/run_tests.py

  build:
    # Nothing is built or attached to a release unless lint and every
    # test job passed. Costs a few minutes of latency per push; it means a
    # failing Mac test can't ship an installer (2026-10-06).
    needs: [lint, test]
    strategy:
      # One platform's build failing must not cancel the others' — the
      # Mac tours and the Windows installer are evidence we want anyway.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # No asset_name: Windows ships only the Inno Setup installer
            # (SaxShopCompanion-Windows-Setup-{version}.exe), uploaded by
            # its own dedicated step.
            full_build: true
          - os: macos-latest
            artifact_name: SaxShopCompanion.app
            asset_name: SaxShopCompanion-macOS.zip
            full_build: true
          - os: macos-15-intel
            artifact_name: SaxShopCompanion.app
            asset_name: SaxShopCompanion-macOS-Intel.zip
            full_build: false
          - os: ubuntu-latest
            artifact_name: SaxShopCompanion
            asset_name: SaxShopCompanion-Linux
            full_build: true

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install system audio libraries (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libx11-dev

      - name: Install dependencies (full)
        if: matrix.full_build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dependencies (Intel Mac — numpy but no audio stack)
        if: "!matrix.full_build"
        run: |
          python -m pip install --upgrade pip
          pip install svgwrite numpy pyinstaller

      # GPU strobe tuner renderer (Rust/wgpu) — only for full builds, and
      # never on macOS: Tk Aqua's winfo_id() is not an NSView, so wgpu
      # can't attach a surface there. Macs are canvas-only by design
      # (see the tuner_render import gate in tuner_tab.py).
      - name: Install Rust toolchain
        if: matrix.full_build && !startsWith(matrix.os, 'macos')
        uses: dtolnay/rust-toolchain@stable

      - name: Build GPU tuner renderer
        if: matrix.full_build && !startsWith(matrix.os, 'macos')
        run: |
          pip install maturin
          python -m maturin build --release --manifest-path tuner_renderer/Cargo.toml
          pip install --find-links tuner_renderer/target/wheels tuner_render

      # The only place CI has the GPU wheel. Runners have a software adapter
      # (Windows: Basic Render Driver) or no Vulkan at all (Linux), so this
      # exercises the "software adapter / init failure -> canvas" fallbacks
      # for real; the GPU draw path itself only runs on a machine with a GPU.
      - name: Tuner suites with the GPU wheel
        if: matrix.full_build && !startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          pip install -r requirements.txt
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y xvfb
            xvfb-run -a python tools/test_gpu_tuner.py
            xvfb-run -a python tools/test_tuner_canvas.py
          else
            python tools/test_gpu_tuner.py
            python tools/test_tuner_canvas.py
          fi

      - name: Build with PyInstaller
        run: python build.py

      # Frozen-build probe: launch what was just built with --selftest,
      # which constructs the whole app headless and exits 0/1. This is the
      # only check that runs the shipped bundle rather than the source
      # tree (missing hidden imports, bad data paths, a module bundled on
      # the wrong platform). The .exe is a windowed app, so PowerShell
      # must wait on it explicitly.
      - name: Frozen-build probe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\SaxShopCompanion.exe" -ArgumentList "--selftest" -Wait -PassThru
          Write-Host "selftest exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: Frozen-build probe (macOS)
        if: runner.os == 'macOS'
        run: dist/SaxShopCompanion.app/Contents/MacOS/SaxShopCompanion --selftest

      - name: Frozen-build probe (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a dist/SaxShopCompanion --selftest

      # Eyes on the Mac: nobody on the project owns one. Launch the built
      # app for real, screenshot the runner's screen, upload it. Never
      # fails the build — it's a picture for a human to look at.
      # Eyes on the Mac: nobody on the project owns one. The built .app
      # walks every tab and dialog (`--tour all`), screenshots each, and
      # the pictures are uploaded. The tuner and toner run on synthetic
      # tones (no microphone here); the toner is hidden behind the beta
      # terms, so the launch gets a profile with it unlocked via
      # SAXSHOP_CONFIG_DIR. Never fails the build — it's for a human.
      - name: Screenshot tour of the running app (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/tour-profile" "$RUNNER_TEMP/tour"
          echo '{"toner_unlocked": true, "visible_tabs": {"Toner": true}}' > "$RUNNER_TEMP/tour-profile/app_settings.json"
          SAXSHOP_CONFIG_DIR="$RUNNER_TEMP/tour-profile" dist/SaxShopCompanion.app/Contents/MacOS/SaxShopCompanion --tour all --shots "$RUNNER_TEMP/tour" &
          for i in $(seq 1 60); do
            [ -f "$RUNNER_TEMP/tour/tour-done.txt" ] && break
            sleep 3
          done
          pkill -f SaxShopCompanion || true
          cat "$RUNNER_TEMP/tour/tour-done.txt" || echo "tour did not finish"
          ls -la "$RUNNER_TEMP/tour"
          # Same walk in Dark Mode: the system-colour theming has otherwise
          # only ever been seen in light mode. `defaults write` alone does not
          # change the running session (the first dark tour came back light),
          # so the app forces its windows dark with --appearance dark and
          # tour-done.txt records the measured brightness.
          defaults write -g AppleInterfaceStyle Dark
          mkdir -p "$RUNNER_TEMP/tour-dark"
          SAXSHOP_CONFIG_DIR="$RUNNER_TEMP/tour-profile" dist/SaxShopCompanion.app/Contents/MacOS/SaxShopCompanion --tour all --shots "$RUNNER_TEMP/tour-dark" --appearance dark &
          for i in $(seq 1 60); do
            [ -f "$RUNNER_TEMP/tour-dark/tour-done.txt" ] && break
            sleep 3
          done
          pkill -f SaxShopCompanion || true
          defaults delete -g AppleInterfaceStyle || true
          cat "$RUNNER_TEMP/tour-dark/tour-done.txt" || echo "dark tour did not finish"

      - name: Upload macOS screenshot tours (light + dark)
        if: runner.os == 'macOS'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: mac-tour-${{ matrix.asset_name }}
          path: |
            ${{ runner.temp }}/tour/
            ${{ runner.temp }}/tour-dark/
          if-no-files-found: ignore

      - name: Verify permission keys and code signature (macOS)
        if: runner.os == 'macOS'
        # The plist keys alone are not enough: TCC silently denies (never
        # prompts) if the bundle's signature doesn't validate, which is
        # what happens when Info.plist is patched after signing without
        # re-signing. Every Apple Silicon build through v2.62 shipped
        # that way — build.py now re-signs, and this step catches any
        # regression.
        run: |
          plutil -extract NSMicrophoneUsageDescription raw \
            dist/SaxShopCompanion.app/Contents/Info.plist
          plutil -extract NSCameraUsageDescription raw \
            dist/SaxShopCompanion.app/Contents/Info.plist
          echo "Mic + camera usage descriptions present in bundle."
          codesign --verify --deep --strict dist/SaxShopCompanion.app
          echo "Code signature valid."

      # Windows installer (Inno Setup). installer.iss sources
      # dist\SaxShopCompanion.exe directly, so this runs after PyInstaller.
      - name: Extract app version from config.py
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $content = Get-Content config.py -Raw
          if ($content -match 'APP_VERSION\s*=\s*"([^"]+)"') {
            $ver = $Matches[1]
            "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "APP_VERSION=$ver"
          } else {
            Write-Error "Could not find APP_VERSION in config.py"
            exit 1
          }

      - name: Install Inno Setup
        if: matrix.os == 'windows-latest'
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The installer is what every Windows user runs, and nothing had ever
      # run it. Install silently, launch the INSTALLED copy with --selftest,
      # check the Start Menu shortcut, uninstall silently, and make sure the
      # user's config folder was left alone.
      - name: Installer round-trip (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\SaxShopCompanion-Windows-Setup-*.exe | Select-Object -First 1
          $cfg = "$env:APPDATA\StohrerSaxShopCompanion"
          New-Item -ItemType Directory -Force $cfg | Out-Null
          Set-Content "$cfg\marker.txt" "keep me"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          $exe = "${env:ProgramFiles}\SaxShopCompanion\SaxShopCompanion.exe"
          if (-not (Test-Path $exe)) { throw "installed exe missing at $exe" }
          $r = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
          if ($r.ExitCode -ne 0) { throw "installed copy's selftest exit $($r.ExitCode)" }
          $lnk = "${env:ProgramData}\Microsoft\Windows\Start Menu\Programs\Stohrer Sax Shop Companion\Stohrer Sax Shop Companion.lnk"
          if (-not (Test-Path $lnk)) { throw "Start Menu shortcut missing: $lnk" }
          $unins = Get-ChildItem "${env:ProgramFiles}\SaxShopCompanion\unins*.exe" | Select-Object -First 1
          $u = Start-Process -FilePath $unins.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstaller exit $($u.ExitCode)" }
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $exe) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path $exe) { throw "exe still present 60 s after uninstall" }
          if (-not (Test-Path "$cfg\marker.txt")) { throw "uninstall removed the user's config folder" }
          Write-Host "install -> installed selftest -> Start Menu shortcut -> uninstall OK; config folder preserved"

      # Screenshot tour in German — the longest language, so clipped or
      # overflowing translated labels show up here. Windows build, so Matt
      # sees the cream theme he knows. Never fails the build.
      - name: Screenshot tour in German (Windows)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\tour-de-profile","$env:RUNNER_TEMP\tour-de" | Out-Null
          Set-Content -Encoding utf8 "$env:RUNNER_TEMP\tour-de-profile\app_settings.json" '{"language": "de", "toner_unlocked": true, "visible_tabs": {"Toner": true}}'
          $env:SAXSHOP_CONFIG_DIR = "$env:RUNNER_TEMP\tour-de-profile"
          $p = Start-Process -FilePath "dist\SaxShopCompanion.exe" -ArgumentList "--tour","all","--shots","$env:RUNNER_TEMP\tour-de" -PassThru
          $deadline = (Get-Date).AddSeconds(180)
          while (-not (Test-Path "$env:RUNNER_TEMP\tour-de\tour-done.txt") -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 3 }
          Stop-Process -Id $p.Id -ErrorAction SilentlyContinue
          Get-Content "$env:RUNNER_TEMP\tour-de\tour-done.txt" -ErrorAction SilentlyContinue
          Get-ChildItem "$env:RUNNER_TEMP\tour-de"

      - name: Upload Windows German tour
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: win-tour-de
          path: ${{ runner.temp }}/tour-de/
          if-no-files-found: ignore

      # Rename artifacts for release. Windows ships only the Inno Setup
      # installer — the bare PyInstaller .exe is no longer published.
      - name: Rename Linux artifact
        if: matrix.os == 'ubuntu-latest'
        run: mv dist/SaxShopCompanion dist/SaxShopCompanion-Linux

      # macOS: package the .app with ditto, not `zip -r` — zip follows
      # the bundle's internal Frameworks<->Resources symlinks and stores
      # them as duplicate real files (767 of them in the v2.62 zip),
      # which breaks the code-signature resource seal on extraction.
      # A broken seal means no TCC mic/camera prompt for end users.
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --keepParent SaxShopCompanion.app ${{ matrix.asset_name }}

      - name: Verify signature survives zip round-trip (macOS)
        if: runner.os == 'macOS'
        run: |
          ditto -x -k dist/${{ matrix.asset_name }} "$RUNNER_TEMP/ziptest"
          codesign --verify --deep --strict "$RUNNER_TEMP/ziptest/SaxShopCompanion.app"
          echo "Signature valid after packaging round-trip."

      # Upload artifacts (Linux + macOS use matrix.asset_name; Windows
      # uploads only the installer below).
      - name: Upload artifact
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

      - name: Upload Windows installer artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: SaxShopCompanion-Windows-Setup
          path: dist/SaxShopCompanion-Windows-Setup-*.exe

      # Attach to release if this is a release event
      - name: Upload to Release
        if: matrix.os != 'windows-latest' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer to Release
        if: matrix.os == 'windows-latest' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SaxShopCompanion-Windows-Setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
